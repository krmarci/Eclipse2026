name: Advance terrain cache

on:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eclipse-terrain-cache
  cancel-in-progress: false

jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 345

    steps:
      - name: Keep the backend terrain builder moving
        shell: bash
        run: |
          set -euo pipefail

          status_url="https://spain-eclipse-map.krmarci.chatgpt.site/api/terrain-overlay/multiscale/status?version=3"
          prewarm_url="https://spain-eclipse-map.krmarci.chatgpt.site/api/terrain-overlay/multiscale/prewarm?version=3"

          # Stop after 5 h 35 min, leaving ten minutes before GitHub's hard limit.
          stop_at=$((SECONDS + 20100))
          batch_count=0

          progress_signature() {
            jq -r '[
              .status,
              .completedSamples,
              .completedTiles,
              .activeScaleMetres,
              (.activeTile.z // -1),
              (.activeTile.x // -1),
              (.activeTile.y // -1),
              .activeTileCompletedSamples,
              .updatedAtUtc
            ] | @tsv'
          }

          log_status() {
            jq -r '"Terrain cache: \(.completedSamples)/\(.totalSamples) samples · \(.completedTiles)/\(.totalTiles) tiles · \(.activity)"' <<<"$1"
          }

          payload="$(curl --fail --silent --show-error --max-time 30 "$status_url")"
          log_status "$payload"

          last_logged_tiles="$(jq -r '.completedTiles' <<<"$payload")"
          last_logged_scale="$(jq -r '.activeScaleMetres // 0' <<<"$payload")"

          while (( SECONDS < stop_at )); do
            state="$(jq -r '.status // "error"' <<<"$payload")"

            if [[ "$state" == "ready" ]]; then
              log_status "$payload"
              exit 0
            fi

            if [[ "$state" == "error" ]]; then
              jq -r '.error // "The terrain cache stopped with an unknown error."' <<<"$payload" >&2
              exit 1
            fi

            before="$(progress_signature <<<"$payload")"
            curl --fail --silent --show-error --max-time 30 "$prewarm_url" >/dev/null

            advanced=false

            for poll in $(seq 1 18); do
              sleep 10

              payload="$(curl --fail --silent --show-error --max-time 30 "$status_url")"
              state="$(jq -r '.status // "error"' <<<"$payload")"

              if [[ "$state" == "ready" ]]; then
                log_status "$payload"
                exit 0
              fi

              if [[ "$state" == "error" ]]; then
                jq -r '.error // "The terrain cache stopped with an unknown error."' <<<"$payload" >&2
                exit 1
              fi

              after="$(progress_signature <<<"$payload")"

              if [[ "$after" != "$before" ]]; then
                advanced=true
                ((batch_count += 1))

                completed_tiles="$(jq -r '.completedTiles' <<<"$payload")"
                active_scale="$(jq -r '.activeScaleMetres // 0' <<<"$payload")"

                if (( batch_count % 25 == 0 )) ||
                  [[ "$completed_tiles" != "$last_logged_tiles" ]] ||
                  [[ "$active_scale" != "$last_logged_scale" ]]; then

                  log_status "$payload"
                  last_logged_tiles="$completed_tiles"
                  last_logged_scale="$active_scale"
                fi

                break
              fi
            done

            if [[ "$advanced" != "true" ]]; then
              echo "Terrain cache did not advance within 180 seconds." >&2
              exit 1
            fi
          done

          payload="$(curl --fail --silent --show-error --max-time 30 "$status_url")"
          log_status "$payload"
          echo "The runner reached its safe time limit. A later run can resume from this persisted state."
