name: Update eclipse restriction snapshot

on:
  push:
    branches: [main]
    paths:
      - .github/restrictions-update/request.json

permissions:
  contents: write

concurrency:
  group: eclipse-restrictions-snapshot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build dated GeoJSON and CSV snapshot
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          request_path = Path('.github/restrictions-update/request.json')
          req = json.loads(request_path.read_text(encoding='utf-8'))
          date = req['date']
          timestamp = req['timestamp']
          previous = Path(req['previous_geojson'])
          out_dir = Path('data/restrictions')
          out_dir.mkdir(parents=True, exist_ok=True)
          geo_out = out_dir / f'spain_eclipse_restrictions_{date}.geojson'
          csv_out = out_dir / f'spain_eclipse_restrictions_{date}.csv'

          data = json.loads(previous.read_text(encoding='utf-8'))
          data['metadata']['snapshot_time'] = timestamp
          data['metadata']['important_limit'] = (
              'This is a snapshot, not a guarantee of completeness on eclipse day. '
              'A newly reported access restriction at Valdeloshielos (Tres Cantos) was added on 5 August 2026; '
              'wildfire orders, police controls, capacity closures and municipal measures can still change at short notice.'
          )

          for item in data['metadata'].get('jurisdictions_reviewed', []):
              if item.get('community') == 'Comunidad de Madrid':
                  item['result'] = (
                      'Valdeloshielos access restriction and cancellation of the municipal eclipse event included; '
                      'no wider Community-wide eclipse access ban located.'
                  )

          data['metadata'].setdefault('source_registry', {})['tres_cantos_ser'] = {
              'title': 'Suspendidas las actividades del eclipse en Tres Cantos por el riesgo de incendio',
              'publisher': 'Cadena SER Madrid Norte',
              'url': 'https://cadenaser.com/cmadrid/2026/08/03/suspendidas-las-actividades-del-eclipse-en-tres-cantos-por-el-riesgo-de-incendio-ser-madrid-norte/',
              'tier': 'reputable_media_quoting_municipal_authority',
              'last_updated': '2026-08-03'
          }

          new_feature = {
              'type': 'Feature',
              'geometry': None,
              'properties': {
                  'id': 'mad-tc-01',
                  'name': 'Finca de Valdeloshielos',
                  'autonomous_community': 'Comunidad de Madrid',
                  'province': 'Madrid',
                  'municipality': 'Tres Cantos',
                  'island': None,
                  'restriction_class': 'eclipse_observation_site_access_restriction',
                  'status': 'reported_confirmed',
                  'confidence': 'medium',
                  'effect': {
                      'date': '2026-08-12',
                      'start': None,
                      'end': None,
                      'time_note': 'Exact access-control hours and boundary were not published in the located report.'
                  },
                  'description': (
                      'The municipal eclipse activities were cancelled and access to the Valdeloshielos estate '
                      'is to be restricted as a wildfire-prevention measure.'
                  ),
                  'affected_modes': ['pedestrian', 'vehicle_access', 'eclipse_observation'],
                  'exemptions': [],
                  'road_code': None,
                  'road_reference': None,
                  'direction': None,
                  'planning_relevance': 'viewing_location_unavailable_or_access_limited',
                  'geometry_quality': 'authority_named_place_no_boundary',
                  'map_query': 'Finca de Valdeloshielos, Tres Cantos, Madrid, Spain',
                  'parent_rule': None,
                  'notes': (
                      'The located source reports an announced restriction but does not publish a legal perimeter, '
                      'control points or hours. Geometry is therefore null.'
                  ),
                  'sources': [{
                      'title': 'Suspendidas las actividades del eclipse en Tres Cantos por el riesgo de incendio',
                      'publisher': 'Cadena SER Madrid Norte',
                      'url': 'https://cadenaser.com/cmadrid/2026/08/03/suspendidas-las-actividades-del-eclipse-en-tres-cantos-por-el-riesgo-de-incendio-ser-madrid-norte/',
                      'tier': 'reputable_media_quoting_municipal_authority',
                      'last_updated': '2026-08-03',
                      'source_id': 'tres_cantos_ser'
                  }],
                  'last_verified': timestamp
              }
          }

          features = data.get('features', [])
          features = [f for f in features if f.get('properties', {}).get('id') != 'mad-tc-01']
          features.append(new_feature)
          for feature in features:
              feature.setdefault('properties', {})['last_verified'] = timestamp
          data['features'] = features

          geo_out.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          fields = [
              'id','name','autonomous_community','province','municipality','island',
              'restriction_class','status','confidence','effect_start','effect_end','effect_date',
              'effect_time_note','description','affected_modes','exemptions','road_code',
              'road_reference','direction','planning_relevance','geometry_type','geometry_quality',
              'map_query','source_urls','source_publishers','last_verified','notes'
          ]
          with csv_out.open('w', encoding='utf-8-sig', newline='') as handle:
              writer = csv.DictWriter(handle, fieldnames=fields)
              writer.writeheader()
              for feature in features:
                  p = feature['properties']
                  effect = p.get('effect') or {}
                  sources = p.get('sources') or []
                  geometry = feature.get('geometry')
                  writer.writerow({
                      'id': p.get('id'),
                      'name': p.get('name'),
                      'autonomous_community': p.get('autonomous_community'),
                      'province': p.get('province'),
                      'municipality': p.get('municipality'),
                      'island': p.get('island'),
                      'restriction_class': p.get('restriction_class'),
                      'status': p.get('status'),
                      'confidence': p.get('confidence'),
                      'effect_start': effect.get('start'),
                      'effect_end': effect.get('end'),
                      'effect_date': effect.get('date'),
                      'effect_time_note': effect.get('time_note'),
                      'description': p.get('description'),
                      'affected_modes': '; '.join(p.get('affected_modes') or []),
                      'exemptions': '; '.join(p.get('exemptions') or []),
                      'road_code': p.get('road_code'),
                      'road_reference': p.get('road_reference'),
                      'direction': p.get('direction'),
                      'planning_relevance': p.get('planning_relevance'),
                      'geometry_type': geometry.get('type') if geometry else None,
                      'geometry_quality': p.get('geometry_quality'),
                      'map_query': p.get('map_query'),
                      'source_urls': '; '.join(s.get('url','') for s in sources),
                      'source_publishers': '; '.join(s.get('publisher','') for s in sources),
                      'last_verified': p.get('last_verified'),
                      'notes': p.get('notes')
                  })

          parsed = json.loads(geo_out.read_text(encoding='utf-8'))
          with csv_out.open('r', encoding='utf-8-sig', newline='') as handle:
              csv_count = sum(1 for _ in csv.DictReader(handle))
          geo_count = len(parsed.get('features', []))
          if geo_count != csv_count:
              raise SystemExit(f'Record mismatch: GeoJSON={geo_count}, CSV={csv_count}')
          if geo_count != req['expected_records']:
              raise SystemExit(f'Unexpected record count: {geo_count}')
          print(f'Validated {geo_count} matching records')
          PY

      - name: Commit snapshot
        shell: bash
        run: |
          set -euo pipefail
          date=$(python -c "import json; print(json.load(open('.github/restrictions-update/request.json'))['date'])")
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/restrictions .github/restrictions-update/request.json
          git commit -m "Update eclipse restriction datasets ${date}"
          git push
