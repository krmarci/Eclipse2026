name: Assemble eclipse restriction datasets 2026-08-03

on:
  push:
    branches: [main]
    paths: ['.github/eclipse-restrictions-upload-2026-08-03/READY']

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and validate
        shell: bash
        run: |
          set -euo pipefail
          upload_dir='.github/eclipse-restrictions-upload-2026-08-03'
          output_dir='data/restrictions'
          mkdir -p "$output_dir"
          cat "$upload_dir"/geojson.part.* | base64 --decode > "$output_dir/spain_eclipse_restrictions_2026-08-03.geojson"
          cat "$upload_dir"/csv.part.* | base64 --decode > "$output_dir/spain_eclipse_restrictions_2026-08-03.csv"
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root=Path('data/restrictions')
          gj=json.loads((root/'spain_eclipse_restrictions_2026-08-03.geojson').read_text(encoding='utf-8'))
          with (root/'spain_eclipse_restrictions_2026-08-03.csv').open(encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f))
          assert gj['type']=='FeatureCollection'
          assert len(gj['features'])==len(rows)==83
          print('Validated 83 records')
          PY
      - name: Commit datasets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/eclipse-restrictions-upload-2026-08-03
          rm -f .github/workflows/assemble-eclipse-restrictions-2026-08-03.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/restrictions .github/eclipse-restrictions-upload-2026-08-03 .github/workflows/assemble-eclipse-restrictions-2026-08-03.yml
          git commit -m 'Update eclipse restriction datasets 2026-08-03'
          git push
